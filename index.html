<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>CoC 7e 檢定小工具</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f4f4f9; }
        .box { background: white; padding: 15px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { font-size: 1.2em; color: #333; }
        input { width: 60px; padding: 5px; margin: 5px 0; }
        button { padding: 5px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        .result { margin-top: 10px; font-weight: bold; padding: 10px; background: #eee; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>CoC 7e 檢定助手</h1>

    <!-- 1) 技能檢定 -->
    <div class="box">
        <h2>技能檢定</h2>
        技能值: <input type="number" id="skillVal" min="0" max="100" value="50">
        <button onclick="rollSkill()">檢定</button>
        <div id="skillResult" class="result">請輸入技能值並點擊檢定</div>
    </div>

    <!-- 2) 理智檢定 -->
    <div class="box">
        <h2>理智檢定</h2>
        理智值: <input type="number" id="sanVal" min="0" max="99" value="50"><br>
        失敗扣減 (d): <input type="number" id="sanD" min="1" max="10" value="6"> (即 1d?)<br>
        成功扣減: <input type="number" id="sanSuccess" min="0" max="99" value="0">
        <br>
        <button onclick="rollSan()">理智檢定</button>
        <div id="sanResult" class="result">請輸入資訊並點擊檢定</div>
    </div>

    <script>
        function rollDice() { return Math.floor(Math.random() * 100) + 1; }

        function rollSkill() {
            const skill = parseInt(document.getElementById('skillVal').value);
            const roll = rollDice();
            let msg = `投擲結果: ${roll} / 技能值: ${skill}<br>`;

            if (roll > skill) {
                msg += "結果: 失敗";
            } else {
                if (roll <= skill / 5) msg += "結果: 極限成功 (Extreme Success)";
                else if (roll <= skill / 2) msg += "結果: 困難成功 (Hard Success)";
                else msg += "結果: 成功 (Regular Success)";
            }
            document.getElementById('skillResult').innerHTML = msg;
        }

        function rollSan() {
            const san = parseInt(document.getElementById('sanVal').value);
            const d = parseInt(document.getElementById('sanD').value);
            const successSub = parseInt(document.getElementById('sanSuccess').value);
            const roll = rollDice();
            let msg = `投擲結果: ${roll} / SAN值: ${san}<br>`;

            if (roll > san) {
                const loss = Math.floor(Math.random() * d) + 1;
                msg += `結果: 失敗，扣減 1d${d}，損失: ${loss} 點 SAN`;
            } else {
                msg += `結果: 成功，扣減: ${successSub} 點 SAN`;
            }
            document.getElementById('sanResult').innerHTML = msg;
        }
    </script>
</body>
</html>
